<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/png" href="/static/assets/logos/favicon.png"><link rel="manifest" href="/static/manifest.webmanifest"><link rel="apple-touch-icon" href="/static/assets/pwa/apple-touch-icon.png"><meta name="theme-color" content="#086f78"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="EmbryoMatrix"><title>Sign in · Embryo Matrix</title>
<style>
:root{--bg:#f3f7f6;--card:#fff;--ink:#17302f;--mut:#6b7f7d;--line:#d6e2e0;--brand:#0a7180;--err:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#10191a;--card:#172324;--ink:#e6f0ef;--mut:#93a8a6;--line:#2b3d3e;--brand:#3fb0c0;--err:#ff8a80}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.4 Inter,system-ui,sans-serif;padding:16px}
form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px}
h1{margin:0 0 4px;font-size:21px}p{margin:0 0 20px;color:var(--mut);font-size:13px}
label{display:block;font-size:12px;font-weight:600;margin:12px 0 5px}
input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:999px;background:transparent;color:inherit;font:inherit}
input:focus{outline:2px solid var(--brand);outline-offset:1px}
button{margin-top:20px;width:100%;padding:12px;border:0;border-radius:999px;background:var(--brand);color:#fff;font:600 15px Inter,system-ui,sans-serif;cursor:pointer}
button:disabled{opacity:.6}#err{color:var(--err);font-size:13px;min-height:18px;margin-top:12px}
/* Brand watermark, same faint mark as the app shell. */
body::after{content:"";position:fixed;top:50%;left:50%;width:min(56vmin,520px);height:min(56vmin,520px);translate:-50% -50%;background:url("/static/assets/logos/watermark.png") center/contain no-repeat;opacity:.1;pointer-events:none;z-index:300}
@media(prefers-color-scheme:dark){body::after{opacity:.18}}
</style></head><body>
<form id="f"><img src="/static/assets/logos/logo.png" alt="" width="52" height="52" style="display:block;margin:0 0 12px"><h1>EmbryoMatrix</h1><p>Sign in to continue</p>
<label for="u">Username</label><input id="u" autocomplete="username" autocapitalize="none" required autofocus>
<label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required>
<div id="err" role="alert"></div><button id="b">Sign in</button></form>
<script>
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('b'),err=document.getElementById('err');b.disabled=true;err.textContent='';
try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});
if(r.ok){location.href='/';return}const j=await r.json().catch(()=>({}));err.textContent=j.detail||'Sign-in failed'}catch(x){err.textContent='Could not reach the server'}b.disabled=false});
</script><script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))</script></body></html>
